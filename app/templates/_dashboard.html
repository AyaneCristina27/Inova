{% load plotly_dash %}
<section id="dashboard" class="inova-dash">
  <style>
    .inova-dash { --laranja: #E07B39; --preto: #1C1C1C; --fundo: #FBF1E9; background: var(--fundo); padding: 24px; border-radius: 16px; font-family: "Montserrat", "Segoe UI", Arial, sans-serif; color: #333; text-align: left; }
    .inova-dash * { box-sizing: border-box; }

    /* Topo */
    .inova-dash .dash-topo { background: var(--preto); color: #fff; border-radius: 14px; padding: 18px 24px; margin-bottom: 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .inova-dash .dash-topo h2 { margin: 0; font-size: 1.4rem; color: #fff; text-align: left; }
    .inova-dash .dash-topo h2 span { color: var(--laranja); }
    .inova-dash .dash-topo p { margin: 4px 0 0; color: #bbb; font-weight: 600; font-size: .85rem; }
    .inova-dash .dash-topo-icone { width: 40px; height: 40px; min-width: 40px; border-radius: 8px; background: rgba(224, 123, 57, .18); color: var(--laranja); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }

    /* Filtros */
    .inova-dash .dash-filtros { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 18px; }
    .inova-dash .dash-dropdown { min-width: 260px; }
    .inova-dash .dash-limpar { background: #fff; border: 1px solid var(--laranja); color: var(--laranja); font-weight: 600; border-radius: 8px; padding: 7px 14px; cursor: pointer; }
    .inova-dash .dash-limpar:hover { background: var(--laranja); color: #fff; }
    .inova-dash .dash-dica { color: #888; font-size: .8rem; }

    /* Cartões */
    .inova-dash .dash-kpis { display: grid; gap: 12px; margin-bottom: 14px; }
    .inova-dash .dash-kpis-principais { grid-template-columns: repeat(12, minmax(0, 1fr)); }
    .inova-dash .dash-kpis-principais .dash-kpi:nth-child(-n+4) { grid-column: span 3; }
    .inova-dash .dash-kpis-principais .dash-kpi:nth-child(n+5) { grid-column: span 4; }
    .inova-dash .dash-kpis-duplo { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .inova-dash .dash-kpi { background: #fff; border: 1px solid #eee; border-radius: 10px; padding: 14px 16px; box-shadow: 0 1px 3px rgba(0, 0, 0, .05); min-width: 0; }
    .inova-dash .dash-kpi-topo { display: flex; align-items: center; gap: 8px; }
    .inova-dash .dash-kpi-icone { width: 26px; height: 26px; min-width: 26px; border-radius: 6px; background: rgba(224, 123, 57, .12); color: var(--laranja); display: flex; align-items: center; justify-content: center; font-size: .75rem; }
    .inova-dash .dash-kpi-rotulo { font-size: .8rem; color: #555; }
    .inova-dash .dash-kpi-valor { display: block; font-size: 1.6rem; font-weight: 700; color: var(--preto); margin-top: 10px; line-height: 1; }
    .inova-dash .dash-kpi-linha { display: flex; align-items: baseline; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .inova-dash .dash-kpi-linha .dash-kpi-valor { margin-top: 0; }
    .inova-dash .dash-kpi-linha small { color: #888; font-size: .78rem; }
    .inova-dash .dash-secao { font-size: .78rem; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: .04em; margin: 10px 0 8px; text-align: left; }

    /* Gráficos */
    .inova-dash .dash-graficos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 4px; }
    .inova-dash .dash-card { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 6px; box-shadow: 0 1px 3px rgba(0, 0, 0, .05); min-width: 0; }
    .inova-dash .dash-largo { grid-column: span 2; }

    /* Celular e telas menores */
    @media (max-width: 900px) {
      .inova-dash .dash-kpis-principais { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .inova-dash .dash-kpis-principais .dash-kpi:nth-child(n) { grid-column: auto; }
      .inova-dash .dash-kpis-duplo { grid-template-columns: 1fr; }
      .inova-dash .dash-graficos { grid-template-columns: 1fr; }
      .inova-dash .dash-largo { grid-column: span 1; }
    }
  </style>

  <script src="https://cdn.plot.ly/plotly-4.1.1.min.js"></script>
  {% plotly_header %}
  {% plotly_direct name="DashboardInova" %}
  {% plotly_footer %}
</section>
