{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-mail Enviado - INova Sudoeste de Minas</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'login.css' %}">
</head>
<body class="login-body">

  <svg class="login-bg-wave login-bg-wave-top" viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,80 C100,20 180,140 300,60 C380,10 450,60 500,20" fill="none" stroke="#e58732" stroke-opacity="0.25" stroke-width="2"/>
    <path d="M0,140 C100,80 180,200 300,120 C380,70 450,120 500,80" fill="none" stroke="#e58732" stroke-opacity="0.15" stroke-width="2"/>
  </svg>

  <div class="login-wrapper">
    <div class="login-card" style="grid-template-columns: 1fr;">
      <div class="login-right" style="max-width: 480px; margin: 0 auto; width: 100%; text-align: center;">
        <div class="login-icon-badge" style="margin: 0 auto 1.2rem;"><i class="fa-solid fa-envelope-circle-check"></i></div>
        <h1>Verifique seu e-mail</h1>
        <p class="login-subtitle">
          Se o e-mail informado estiver cadastrado em nosso sistema, você receberá em instantes um link para redefinir sua senha. Não esqueça de checar a caixa de spam.
        </p>

        <a href="{% url 'login' %}" class="login-btn-primary" style="text-decoration: none; margin-top: 1rem;">
          Voltar para o login <i class="fa-solid fa-arrow-right"></i>
        </a>
      </div>
    </div>
  </div>
</body>
</html>
