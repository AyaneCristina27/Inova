{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redefinir Senha - INova Sudoeste de Minas</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'login.css' %}">
</head>
<body class="login-body">

  <svg class="login-bg-wave login-bg-wave-top" viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,80 C100,20 180,140 300,60 C380,10 450,60 500,20" fill="none" stroke="#e58732" stroke-opacity="0.25" stroke-width="2"/>
    <path d="M0,140 C100,80 180,200 300,120 C380,70 450,120 500,80" fill="none" stroke="#e58732" stroke-opacity="0.15" stroke-width="2"/>
  </svg>
  <svg class="login-bg-wave login-bg-wave-bottom" viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,220 C120,280 200,160 320,240 C400,290 460,240 500,270" fill="none" stroke="#e58732" stroke-opacity="0.25" stroke-width="2"/>
    <path d="M0,160 C120,220 200,100 320,180 C400,230 460,180 500,210" fill="none" stroke="#e58732" stroke-opacity="0.15" stroke-width="2"/>
  </svg>

  <div class="login-wrapper">
    <div class="login-card" style="grid-template-columns: 1fr;">
      <div class="login-right" style="max-width: 480px; margin: 0 auto; width: 100%;">
        <div class="login-icon-badge"><i class="fa-solid fa-key"></i></div>
        <h1>Esqueci minha senha</h1>
        <p class="login-subtitle">Informe o e-mail cadastrado e enviaremos um link para redefinir sua senha.</p>

        {% if form.errors %}
          <div class="login-error">Verifique o e-mail informado e tente novamente.</div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <div class="login-field">
            <label for="id_email">E-mail</label>
            <div class="login-input-wrap">
              <i class="fa-regular fa-envelope"></i>
              <input type="email" name="email" id="id_email" placeholder="Digite seu e-mail cadastrado" required autofocus>
            </div>
          </div>

          <button type="submit" class="login-btn-primary">
            Enviar link de redefinição <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>

        <div class="login-divider"><span>ou</span></div>

        <a href="{% url 'login' %}" class="login-btn-secondary">
          <i class="fa-solid fa-arrow-left"></i> Voltar para o login
        </a>
      </div>
    </div>
  </div>
</body>
</html>
